[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dl-optimization-theory"
version = "0.1.0"
description = "Advanced optimization theories and visualizations for Deep Learning."
readme = "README.md"
requires-python = ">=3.10"
dependencies =[
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select =["E", "F", "I", "UP", "N", "NPY", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.hatch.build.targets.wheel]
packages = ["src"]
